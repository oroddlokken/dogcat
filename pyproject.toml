[project]
name = "dogcat"
dynamic = ["version"]
description = "lightweight, file-based issue tracking for AI agents (and humans)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.27.1",
    "watchdog>=4.0.0",
    "rich>=15.0.0",
    "orjson>=3.11.9",
    "textual>=8.2.8",
    "tomli-w>=1.0.0",
    "tomli>=2.4.1; python_version < '3.11'",
]

[project.scripts]
dcat = "dogcat.app:main"
dogcat = "dogcat.app:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "no-guess-dev" }

[tool.hatch.build.hooks.vcs]
version-file = "src/dogcat/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dogcat"]

[project.optional-dependencies]
web = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "dogcat[web]",
    "httpx>=0.28.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist[psutil]",
    "ruff>=0.16.2",
    "pyright>=1.1.411",
    "vulture>=2.16",
    "pytest-timeout>=2.4.0",
    "pytest-testmon>=2.2.0",
    "djlint>=1.44.1",
    "hypothesis>=6.165.2",
]

[tool.ruff]
line-length = 88
exclude = ["src/dogcat/_version.py"]

[tool.ruff.lint]
select = [
  "A",    # flake8-builtins
  "ARG",  # flake8-unused-arguments 
  "ASYNC", # flake8-async
  "B",    # bugbear
  "BLE",  # flake8-blind-except
  "C4",   # flake8-comprehensions
  "C90",  # McCabe complexity
  "COM",  # flake8-commas
  "D",    # pydocstyle
  "DTZ",  # flake8-datetimez 
  "E",    # pycodestyle, error
  "EM",   # flake8-errmsg
  "ERA",  # flake8-eradicate
  "EXE",  # flake8-executable
  "F",    # Pyflakes
  "FA",   # flake8-future-annotations
  "FBT",  # flake8-boolean-trap
  "FLY",  # flynt
  "FURB", # refurb
  "G",    # flake8-logging-format 
  "I",    # isort
  "ICN",  # flake8-import-conventions 
  "INP",  # flake8-no-pep420 
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "N",    # pep8-naming
  "PERF", # Perflint 
  "PIE",  # flake8-pie
  "PL",   # Pylint (PLC, PLE, PLR, PLW)
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib 
  "PYI",  # flake8-pyi
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # Ruff
  "S",    # flake8-bandit (security)
  "SIM",  # flake8-simplify
  "SLF",  # flake8-self 
  "SLOT", # flake8-slots
  "T10",  # flake8-debugger
  "T20",  # flake8-print
  "TC",   # flake8-type-checking
  "TID",  # flake8-tidy-imports
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle, warning
  "YTT",  # flake8-2020
]
ignore = [
  "COM812", # Checks for the absence of trailing commas
  "RUF100", # Unused blanket noqa directive
  "EXE001", # Shebang is present but file is not executable
  "D105",   # Missing docstring in magic method
  "D107",   # Missing docstring in __init__
  "D203",   # 1 blank line required before class docstring
  "D212",   # Multi-line docstring summary should start at the first line
  "D213",   # Multi-line docstring summary should start at the second line
  "D413",   # Missing blank line after last section ("{name}")
  "D416",   # Section name should end with a colon ("{name}")
  "TRY301", # Abstract raise to inner function - too pedantic for CLI code
  "B904",   # raise ... from err - tedious for CLI exits
  "BLE001", # Blind except - intentional for defensive TUI/CLI code
  "C901",   # McCabe complexity - CLI commands are inherently complex
  "PLR0912", # Too many branches - the same complaint as C901, already settled above
  "SLF001", # Private member access - common pattern in this codebase
  "TRY401", # Redundant exception in logging.exception - stylistic
  "G004",   # Logging f-string - acceptable in this project
  "PLR0911", # Too many return statements - CLI dispatch fans out
  "PLR0913", # Too many arguments - Typer commands mirror their option list
  "PLR0915", # Too many statements - see C901
  "PLR0917", # Too many positional arguments - fights stdlib-mirroring signatures
  "PLR2004", # Magic value comparison - too noisy
  "FBT001",  # Boolean positional arg in definition - Typer flags are booleans
  "FBT002",  # Boolean default positional arg - as above
  "FBT003",  # Boolean positional value in call
  "T201",    # print - this is a CLI; print is the output channel
  "S608",    # SQL injection - false positive for parameterized queries
  # Deferred imports are how this CLI keeps startup cheap, and they are
  # load-bearing: `import dogcat.cli` pulls in no textual, fastapi or uvicorn
  # module, because each sits inside the function that needs it. `python -X
  # importtime` puts textual.app alone at ~360ms against dogcat.cli's ~605ms,
  # so hoisting these to module scope would roughly double what every `dcat`
  # invocation pays. Several also break import cycles inside cli/. (colophon-59t5)
  "PLC0415", # Import outside top-level
]

[tool.ruff.lint.per-file-ignores]
# D103: missing docstring in public function — test functions are self-documenting.
# INP001: implicit namespace package — the tests dir intentionally has no __init__.py.
# S101: use of assert — asserts are the point of a test.
# S105/S106: hardcoded password — test fixtures use throwaway credentials.
# S603/S607: the suite drives real `git` with fixed argv to build repo fixtures;
#   the src-side calls carry per-line noqa instead (see dogcat/git.py).
# S108: "/tmp/..." here is fixture *text* fed to path parsing, never opened.
# PLE2502: test_storage.py pins the round-trip of bidi control characters
#   (dogcat-2rpd), so the file must literally contain them.
"tests/**" = [
  "D103",
  "INP001",
  "S101",
  "S105",
  "S106",
  "S603",
  "S607",
  "S108",
  "PLE2502",
]

# The list-view commands annotate their options with the shared Annotated
# aliases from cli/_list_options. Under `from __future__ import annotations`
# Typer still resolves those annotations at runtime (get_type_hints), so the
# imports must stay at module scope — TC001 ("move into TYPE_CHECKING") would
# reintroduce a NameError. (dogcat-5bhv)
# Now every command module, not just the list views: --dogcats-dir and
# --json moved into the same shared aliases. (dogcat-1fr8)
"src/dogcat/cli/_cmd_*.py" = ["TC001"]

[tool.pyright]
venvPath = "."
venv = ".venv"
exclude = ["scratch", ".venv", "src/dogcat/_version.py"]
typeCheckingMode = "strict"
stubPath = "./typings"
reportMissingTypeStubs = "none" # Annoying
reportPrivateUsage = "none"     # Ruff handles this 
reportUnusedFunction = "none"   # Vulture handles this
deprecateTypingAliases = true
# basedpyright rules:
reportUnreachable = true

[tool.djlint]
ignore = "H023,H030,H031,J018"
profile = "jinja"
blank_line_after_tag = "load,extends,include"
blank_line_before_tag = "load,extends,include"
max_blank_lines = 1

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "strict"
addopts = [
    "--dist=worksteal",
    "-p", "no:pastebin",
    "-p", "no:nose",
    "-p", "no:doctest",
]
filterwarnings = [
    "ignore:unclosed database:ResourceWarning",
]
